<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Travel Tribbe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/images/hero_bg.jpg" />
    <link rel="preload" as="image" href="/images/ttt-logo.png" />
    <link rel="preload" as="image" href="/images/pexels-asadphoto-29901905.jpg" />
    <link rel="preload" as="image" href="/images/pexels-asadphoto-9482125.jpg" />
    <link rel="preload" as="image" href="/images/pexels-fabiorocha89-39159107.jpg" />
    <link rel="preload" as="image" href="/images/pexels-husam-wafaei-682295758-27571384.jpg" />
    <link rel="preload" as="image" href="/images/pexels-maria-charizani-3542905-5577693.jpg" />
  </head>
  <body>
    <div id="preloader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#FAFAFA;display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity 0.4s ease;">
      <div style="text-align:center;">
        <div style="width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:#D4AF37;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
        <div style="font-family:'Playfair Display',serif;color:#1A1A1A;font-size:1.2rem;font-weight:600;">The Travel Tribbe</div>
      </div>
    </div>
    <script>
      window.addEventListener('load', function() {
        var p = document.getElementById('preloader');
        if (p) { p.style.opacity = '0'; setTimeout(function() { p.style.display = 'none'; }, 400); }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
